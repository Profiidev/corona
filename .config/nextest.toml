[profile.default]
slow-timeout = { period = "15s", terminate-after = 2 }
fail-fast = false

[profile.default.junit]
path = "junit.xml"

# gpui-shell's benchmarks take ~12s in a debug build here, over 30s on a CI runner.
[[profile.default.overrides]]
filter = "package(gpui-shell) & test(/benchmark/)"
slow-timeout = { period = "60s", terminate-after = 2 }
