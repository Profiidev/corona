[package]
name = "corona_script"
description = "JavaScript plugins and scripting for the Corona shell"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
test-support = ["gpui-kit/test-support"]

[dependencies]
tempfile.workspace = true
corona_config.workspace = true
corona_surface.workspace = true
corona_settings.workspace = true
corona_components.workspace = true
corona_utils.workspace = true
corona_bluez.workspace = true
corona_sysinfo.workspace = true
corona_printing.workspace = true
corona_mpris.workspace = true
corona_notifications.workspace = true
corona_ipc.workspace = true
gpui-kit.workspace = true
corona_js.workspace = true
specta.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
dirs.workspace = true
flume.workspace = true
futures-lite.workspace = true
rust-i18n.workspace = true
rust-i18n-support.workspace = true
uuid = { workspace = true, features = ["v4"] }
schemars.workspace = true
url.workspace = true
zbus.workspace = true
zbus_xml.workspace = true
oo7.workspace = true
futures.workspace = true
# only for its jpeg feature: plugin icons
image = { workspace = true, features = ["jpeg"] }
clap.workspace = true
# kill the whole git process group on timeout
libc.workspace = true

[dev-dependencies]
corona_compositor.workspace = true
corona_surface = { workspace = true, features = ["test-support"] }
corona_desktop.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
corona_utils = { workspace = true, features = ["test-support"] }
