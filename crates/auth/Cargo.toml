[package]
name = "corona_auth"
description = "PAM authentication for the Corona shell"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
corona_utils.workspace = true
rust-i18n.workspace = true
serde.workspace = true
corona_config.workspace = true
gpui-kit.workspace = true
zbus.workspace = true
anyhow.workspace = true
futures-lite.workspace = true
smol.workspace = true
futures.workspace = true
tracing.workspace = true
libc.workspace = true
pam-client.workspace = true

[dev-dependencies]
corona_utils = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# pipewire's bindgen turns on clang-sys `runtime`, then pam-sys's bindgen must
# load libclang itself (from LIBCLANG_PATH) or its build script panics
[build-dependencies]
bindgen.workspace = true
