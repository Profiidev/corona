[package]
name = "corona_clipboard"
description = "Clipboard history and pasting for the Corona shell"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
corona_utils.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
corona_config.workspace = true
rust-i18n.workspace = true
jiff.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
dirs.workspace = true
flume.workspace = true
tracing.workspace = true
rustix = { workspace = true, features = ["fs", "pipe", "event"] }
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
wayland-protocols-misc.workspace = true
rusqlite.workspace = true
sha2.workspace = true
image = { workspace = true, features = ["jpeg"] }
hex.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
