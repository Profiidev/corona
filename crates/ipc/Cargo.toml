[package]
name = "corona_ipc"
description = "IPC between the Corona CLI and the running shell"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
test-support = ["dep:tempfile"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
corona_utils.workspace = true
tempfile = { workspace = true, optional = true }
tracing.workspace = true
serde_json.workspace = true
serde.workspace = true
smol.workspace = true
gpui-kit.workspace = true
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
corona_utils = { workspace = true, features = ["test-support"] }
