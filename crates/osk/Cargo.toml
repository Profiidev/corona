[package]
name = "corona_osk"
description = "On-screen keyboard for the Corona shell"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
corona_compositor.workspace = true
corona_config.workspace = true
corona_surface.workspace = true
corona_utils.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
bitflags.workspace = true
dirs.workspace = true
flume.workspace = true
tracing.workspace = true
rust-i18n.workspace = true
rustix = { workspace = true, features = ["event", "fs"] }
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["unstable"] }
wayland-protocols-misc.workspace = true
xkbcommon = "0.8.0"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
wayland-server.workspace = true
wayland-protocols = { workspace = true, features = ["server", "unstable"] }
wayland-protocols-misc = { workspace = true, features = ["server"] }
