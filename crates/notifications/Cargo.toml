[package]
name = "corona_notifications"
description = "Desktop notification server for the Corona shell"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
corona_components.workspace = true
corona_compositor.workspace = true
corona_surface.workspace = true
corona_settings.workspace = true
corona_launcher.workspace = true
corona_ipc.workspace = true
corona_js.workspace = true
corona_script.workspace = true
specta.workspace = true
specta-typescript = "=0.0.14"
rust-i18n.workspace = true
serde.workspace = true
uuid.workspace = true
clap.workspace = true
regex.workspace = true
jiff.workspace = true
corona_utils.workspace = true
corona_config.workspace = true
gpui-kit.workspace = true
zbus.workspace = true
anyhow.workspace = true
flume.workspace = true
futures-lite.workspace = true
smol.workspace = true
tracing.workspace = true
dirs.workspace = true
image.workspace = true
rodio = { version = "0.23.0", default-features = false, features = [
  "playback",
  "vorbis"
] }
# rodio has no released `pipewire` feature yet; this turns on cpal's backend for it
cpal = { version = "0.18.2", default-features = false, features = ["pipewire"] }

[dev-dependencies]
corona_script = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
corona_utils = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
