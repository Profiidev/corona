[package]
name = "corona_brightness"
description = "Backlight and DDC monitor brightness for the Corona shell"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
corona_config.workspace = true
corona_location.workspace = true
corona_utils.workspace = true
gpui-kit.workspace = true
zbus.workspace = true
anyhow.workspace = true
flume.workspace = true
tracing.workspace = true
futures-lite.workspace = true
jiff = "0.2.37"
rustix = { workspace = true, features = ["event", "fs"] }
wayland-client.workspace = true
wayland-protocols-wlr.workspace = true

[dev-dependencies]
corona_utils = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
wayland-server = "0.31"
wayland-protocols-wlr = { workspace = true, features = ["server"] }
