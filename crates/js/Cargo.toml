[package]
name = "corona_js"
description = "rquickjs runtime for Corona plugins (spike)"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
tracing.workspace = true
rquickjs = { version = "0.14", features = ["futures", "macro", "loader"] }
specta = { version = "=2.0.0-rc.27", features = ["derive", "function"] }
specta-typescript = "=0.0.14"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tracing-subscriber.workspace = true
