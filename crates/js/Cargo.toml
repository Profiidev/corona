[package]
name = "corona_js"
description = "rquickjs runtime for Corona plugins"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
gpui-kit.workspace = true
gpui-fps.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde_json.workspace = true
futures.workspace = true
uuid = { workspace = true, features = ["v4"] }
rquickjs.workspace = true
specta.workspace = true
specta-typescript.workspace = true
# applies the serde attributes of host types to their TypeScript
specta-serde.workspace = true
serde.workspace = true
# sandboxed filesystem access: every op goes through a granted directory handle
cap-std.workspace = true
libc.workspace = true
# the IO of the stdlib runs here, off the gpui executor
tokio.workspace = true
rustls.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
url.workspace = true
base64.workspace = true
sha1.workspace = true
sha2.workspace = true
md-5.workspace = true
flate2.workspace = true
getrandom.workspace = true
# strips TypeScript types to whitespace, keeping positions. Pinned: swc majors weekly
swc_ts_fast_strip.workspace = true
swc_common.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tracing-subscriber.workspace = true
