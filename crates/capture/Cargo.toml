[package]
name = "corona_capture"
description = "Screen and window capture for the Corona shell"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
image.workspace = true
futures.workspace = true
gbm = { version = "0.18.0", default-features = false }
gpui_wgpu = { package = "gpui-pre-wgpu", version = "0.3.7" }
tracing.workspace = true
rustix = { workspace = true, features = ["fs"] }
wayland-client.workspace = true
wayland-backend.workspace = true
wayland-scanner.workspace = true
wayland-protocols-wlr.workspace = true
wayland-protocols.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
