[package]
name = "corona_components"
description = "Shared UI components, assets and themes of the Corona shell"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
corona_config.workspace = true
corona_utils.workspace = true
tracing.workspace = true
corona_desktop.workspace = true
anyhow.workspace = true
dirs.workspace = true
gpui-kit.workspace = true
include_dir = "0.7.4"
rust-i18n.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
jiff-icu = { version = "0.2.2", default-features = false, features = [
  "std",
  "time"
] }
icu_calendar = "2.3"
icu_datetime = "2.3"
icu_decimal = "2.3"
icu_locale = "2.3"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
