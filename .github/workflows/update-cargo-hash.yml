name: Update Cargo Hash

on:
  pull_request:

jobs:
  update-cargo-hash:
    name: Update Cargo Hash
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      checks: write
      contents: write
    steps:
      - uses: profiidev/gluon@d715c4a8bd804db764307ad041e73c1c60ec7382 # v0
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          url: https://gluon.profidev.io
          profile: pr-automation

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event.pull_request.head.repo.full_name != github.repository

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Check and update cargoHash
        id: check
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash .github/scripts/update-cargo-hash.sh nix/package.nix

      - uses: profiidev/commit-action@63224804083710db4aa5286dc201bca8e71b0858 # v1.0.0
        if: steps.check.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          commit_message: "chore(nix): update cargoHash"
          github_token: ${{ steps.app-token.outputs.token }}
