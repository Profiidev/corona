[workspace]
resolver = "3"
members = ["crates/compositor", "crates/macros", "crates/pipewire"]

[workspace.dependencies]
corona_macros = { path = "crates/macros" }
corona_compositor = { path = "crates/compositor" }
corona_pipewire = { path = "crates/pipewire" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = "12.0.1"
bitflags = "2.13.2"
tracing = "0.1.44"
dashmap = "6.2.1"
flume = "0.12.0"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.6" }

[package]
name = "corona"
version = "0.1.0"
edition = "2024"

[dependencies]
config = { version = "0.15.26", default-features = false, features = ["toml"] }
dirs = "7.0.0"
freedesktop-desktop-entry = "0.8.3"
freedesktop-icons = "0.4.0"
glob = "0.3.4"
gpui-component-shell = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.6" }
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.6" }
include_dir = "0.7.4"
schemars = "1.2.2"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v5"] }
zbus = "5.19.0"
corona_macros = { workspace = true }
corona_compositor = { workspace = true }
corona_pipewire = { workspace = true }
anyhow = { workspace = true }
gpui-kit = { workspace = true }
ts-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
# same patch as upstream gpui-kit
rquickjs = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.6" }

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
