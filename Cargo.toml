[workspace]
resolver = "3"
members = [
  "crates/components",
  "crates/compositor",
  "crates/config",
  "crates/desktop",
  "crates/macros",
  "crates/pipewire",
  "crates/script",
  "crates/shell",
  "crates/surface",
  "crates/utils",
]

[workspace.dependencies]
corona_macros = { path = "crates/macros" }
corona_compositor = { path = "crates/compositor" }
corona_pipewire = { path = "crates/pipewire" }
corona_desktop = { path = "crates/desktop" }
corona_config = { path = "crates/config" }
corona_components = { path = "crates/components" }
corona_surface = { path = "crates/surface" }
corona_script = { path = "crates/script" }
corona_utils = { path = "crates/utils" }
corona_shell = { path = "crates/shell" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.6" }
gpui-component-shell = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.6" }
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.6" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = "12.0.1"
bitflags = "2.13.2"
tracing = "0.1.44"
dashmap = "6.2.1"
flume = "0.12.0"
dirs = "7.0.0"
glob = "0.3.4"
uuid = { version = "1.26.1", features = ["v5"] }
zbus = "5.19.0"

[package]
name = "corona"
version = "0.1.0"
edition = "2024"

[dependencies]
corona_shell = { workspace = true }
corona_components = { workspace = true }
gpui-kit = { workspace = true }
gpui-component-shell = { workspace = true }
tracing-subscriber = "0.3.23"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
# same patch as upstream gpui-kit
rquickjs = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.6" }

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
