[package]
name = "corona"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
bitflags = "2.13.1"
chardetng = "1.0.0"
config = { version = "0.15.25", default-features = false, features = ["toml"] }
dirs = "6.0.0"
glob = "0.3.4"
gpui-kit = "0.6.0"
include_dir = "0.7.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.0", features = ["v5"] }
zbus = "5.19.0"

# PR 40139 (wl_touch support) applied on top of the published crate
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
