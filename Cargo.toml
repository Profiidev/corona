[workspace]
resolver = "3"
members = ["crates/macros"]

[workspace.dependencies]
corona_macros = { path = "crates/macros" }

[package]
name = "corona"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bitflags = "2.13.2"
chardetng = "1.0.0"
config = { version = "0.15.26", default-features = false, features = ["toml"] }
dashmap = "6.2.1"
dirs = "7.0.0"
flume = "0.12.0"
freedesktop-desktop-entry = "0.8.3"
freedesktop-icons = "0.4.0"
glob = "0.3.4"
gpui-component-shell = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.6" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.6" }
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.6" }
include_dir = "0.7.4"
pipewire = "0.10.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ts-rs = "12"
uuid = { version = "1.26.1", features = ["v5"] }
zbus = "5.19.0"
corona_macros = { workspace = true }

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
# same patch as upstream gpui-kit
rquickjs = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.6.6" }

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
