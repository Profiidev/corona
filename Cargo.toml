[workspace]
resolver = "3"
members = [
  "vendor/gpui-shell",
  "crates/components",
  "crates/bluez",
  "crates/brightness",
  "crates/compositor",
  "crates/config",
  "crates/desktop",
  "crates/macros",
  "crates/mpris",
  "crates/network_manager",
  "crates/notifications",
  "crates/pipewire",
  "crates/power",
  "crates/reqwest",
  "crates/script",
  "crates/shell",
  "crates/surface",
  "crates/sysinfo",
  "crates/utils",
  "crates/weather",
  "crates/ipc",
  "crates/cli",
  "crates/capture",
  "crates/tray",
  "crates/idle",
  "crates/auth",
  "crates/auth_screen",
  "crates/greeter",
]

[workspace.dependencies]
corona_macros = { path = "crates/macros" }
corona_compositor = { path = "crates/compositor" }
corona_pipewire = { path = "crates/pipewire" }
corona_desktop = { path = "crates/desktop" }
corona_config = { path = "crates/config" }
corona_components = { path = "crates/components" }
corona_surface = { path = "crates/surface" }
corona_script = { path = "crates/script" }
corona_utils = { path = "crates/utils" }
corona_shell = { path = "crates/shell" }
corona_network_manager = { path = "crates/network_manager" }
corona_mpris = { path = "crates/mpris" }
corona_bluez = { path = "crates/bluez" }
corona_power = { path = "crates/power" }
corona_brightness = { path = "crates/brightness" }
corona_notifications = { path = "crates/notifications" }
corona_sysinfo = { path = "crates/sysinfo" }
corona_weather = { path = "crates/weather" }
corona_reqwest = { path = "crates/reqwest" }
corona_ipc = { path = "crates/ipc" }
corona_cli = { path = "crates/cli" }
corona_capture = { path = "crates/capture" }
corona_tray = { path = "crates/tray" }
corona_idle = { path = "crates/idle" }
corona_auth = { path = "crates/auth" }
corona_auth_screen = { path = "crates/auth_screen" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.7.1" }
gpui-component-shell = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.7.1" }
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.7.1" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = "12.0.1"
bitflags = "2.13.2"
tracing = "0.1.44"
dashmap = "6.2.1"
flume = "0.12.0"
regex = "1.13.1"
dirs = "7.0.0"
toml = "1.1.6"
tracing-subscriber = "0.3.23"
freedesktop-desktop-entry = "0.8.3"
glob = "0.3.4"
uuid = { version = "1.27.0", features = ["v5"] }
zbus = "5.19.0"
zbus_xml = "5.2.1"
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
tempfile = "3.27.0"
futures-lite = "2.6.1"
futures = "0.3.34"
clap = { version = "4.6.7", features = ["derive"] }
smol = "2.0.2"
rust-i18n = "4.2"
rust-i18n-support = { version = "4.2", features = ["codegen"] }
rustix = "1.1.5"
wayland-client = "0.31.15"
wayland-backend = "0.3.17"
wayland-scanner = "0.31.11"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[package]
name = "corona"
version = "0.1.0"
edition = "2024"

[dependencies]
corona_shell.workspace = true
corona_components.workspace = true
corona_reqwest.workspace = true
corona_cli.workspace = true
gpui-kit.workspace = true
gpui-component-shell.workspace = true
tracing-subscriber.workspace = true

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
# same patch as upstream gpui-kit
rquickjs = { git = "https://github.com/longbridge/gpui-kit", tag = "v0.7.1" }

[patch."https://github.com/longbridge/gpui-kit"]
# adds ShellRuntime::load_entry (exact entry path, no main.js default)
gpui-shell = { path = "vendor/gpui-shell" }

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
